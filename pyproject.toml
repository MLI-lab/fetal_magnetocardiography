[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmcg"
version = "0.1.0"
description = "Fetal Magnetocardiography Signal Processing Package"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "torch",
    "scikit-learn",
    "wfdb",
    "nptdms",
    "neurokit2",
    "tqdm",
    "pytorch-minimize",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter",
    "ipywidgets",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=fmcg",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v",
]

[tool.setuptools]
packages = ["fmcg"]
