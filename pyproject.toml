[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmcg"
version = "0.1.0"
description = "Fetal Magnetocardiography Signal Processing Package"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "torch",
    "scikit-learn",
    "wfdb",
    "nptdms",
    "neurokit2",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "ipywidgets",
]

[tool.setuptools]
packages = ["fmcg"]
